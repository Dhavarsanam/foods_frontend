name: foods_app
description: Namma Hotel — table order & billing management app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Smooth page transitions & animations
  animations: ^2.0.11

  # Lightweight local storage — persist daily totals across app restarts
  shared_preferences: ^2.3.2

  # Format currency, dates etc. cleanly
  intl: ^0.19.0

  # PDF generation & printing
  printing: ^5.13.1
  pdf: ^3.10.8

  # Image picker — gallery & camera support
  image_picker: ^1.0.7

  # App documents directory — save picked images permanently
  path_provider: ^2.1.2

  # File path joining utilities
  path: ^1.9.0

  # Supabase — cloud database for bills & daily summaries
#

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # ── Assets ────────────────────────────────────────────────────────────────
  assets:
    - assets/logo.png
    - assets/gss_logo.png
    - assets/images/
    - assets/fonts/

  # ── Fonts ─────────────────────────────────────────────────────────────────
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700